version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      pyo3:
        patterns:
          - "pyo3"
          - "pyo3-*"
  - package-ecosystem: uv
    directory: /python
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
