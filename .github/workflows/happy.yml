name: happy-commit
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  happy:
    uses: kitsuyui/gh-actions-workflows/.github/workflows/happy-commit.yml@a44eeb6694f9d64a288891dfcff1c1c57ca75226
