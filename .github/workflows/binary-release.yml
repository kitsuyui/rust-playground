name: binary release

on:
  pull_request:
    types: [opened, synchronize, reopened]
  release:
    # "released" events are emitted either when directly be released or be edited from pre-released.
    types: [prereleased, released]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

env:
  # Use git tag when release, otherwise use commit hash.
  VERSION: ${{ (github.event_name == 'release' && !github.event.release.prerelease) && github.ref_name || github.sha }}

jobs:
  build:
    name: build ${{ matrix.arch }} on ${{ matrix.os }} with ${{ matrix.gcc }}
    env:
      NAME: kitsuyui-rust-playground # executable binary name
      ARCH: ${{ matrix.arch }}
      OS: ${{ matrix.os }}
      PACKAGE: ${{ matrix.package }}
      GCC: ${{ matrix.gcc }}
      EXECUTABLE: kitsuyui-rust-playground${{ matrix.arch == 'x86_64-pc-windows-gnu' && '.exe' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - arch: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            package: gcc-aarch64-linux-gnu
            gcc: aarch64-linux-gnu-gcc
          - arch: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
            package: gcc-arm-linux-gnueabihf
            gcc: arm-linux-gnueabihf-gcc
          - arch: arm-unknown-linux-gnueabihf
            os: ubuntu-latest
            package: gcc-arm-linux-gnueabihf
            gcc: arm-linux-gnueabihf-gcc
          - arch: x86_64-pc-windows-gnu
            os: ubuntu-latest
            package: gcc-mingw-w64-x86-64
          - arch: x86_64-apple-darwin
            os: macos-latest
          - arch: aarch64-apple-darwin
            os: macos-latest

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify distribution versions
        run: python scripts/check-release-version.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.arch }}

      - name: Install APT packages
        if: (matrix.os == 'ubuntu-latest' || matrix.os == 'ubuntu-22.04') && matrix.package != ''
        timeout-minutes: 10
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            { printf "https://archive.ubuntu.com/ubuntu/\tpriority:1\n"; sed -E "s/(^|[[:space:]])priority:[^[:space:]]+/\\1/g; /^[[:space:]]*(#|$)/! s/$/\tpriority:2/" /etc/apt/apt-mirrors.txt; } | sudo tee /tmp/apt-mirrors-release.txt >/dev/null
            sudo cp /tmp/apt-mirrors-release.txt /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y "$PACKAGE"

      - name: Build target
        run: cargo build --release --verbose --target "$ARCH"

      - name: Compress
        run: |
          mkdir -p ./artifacts
          mv "./target/$ARCH/release/$EXECUTABLE" "./$EXECUTABLE"
          tar -czf "./artifacts/$NAME-$ARCH-$VERSION.tar.gz" "$EXECUTABLE"

      - name: Archive artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: binary-${{ env.VERSION }}-${{ env.ARCH }}-${{ env.OS }}
          path: ./artifacts
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: binary-${{ env.VERSION }}-*
          merge-multiple: true
          path: ./artifacts

      - name: List
        run: find ./artifacts

      - name: Release
        if: github.event_name == 'release' && !github.event.release.prerelease
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: ./artifacts/*.tar.gz
