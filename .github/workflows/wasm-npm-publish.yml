name: wasm

on:
  pull_request:
    types: [opened, synchronize, reopened]
  release:
    # "released" events are emitted either when directly be released or be edited from pre-released.
    types: [prereleased, released]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read
  id-token: write

env:
  # Use git tag when release, otherwise use commit hash.
  VERSION: ${{ (github.event_name == 'release' && !github.event.release.prerelease) && github.ref_name || github.sha }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wasm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verify distribution versions
        working-directory: .
        run: python scripts/check-release-version.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - run: |
          # wasm-pack test --node --firefox --chrome --safari --headless
          wasm-pack build --release --target bundler --scope kitsuyui
          wasm-pack pack

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Check npm version for Trusted Publishing
        run: |
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1)' "$(npm --version)"

      - name: Validate generated package metadata
        if: github.event_name == 'release'
        run: |
          set -eu
          expected_version="${GITHUB_REF_NAME#v}"
          package_name=$(node -p "require('./pkg/package.json').name")
          package_version=$(node -p "require('./pkg/package.json').version")
          if [ "$package_name" != '@kitsuyui/kitsuyui-rust-playground-wasm' ]; then
            echo "unexpected wasm package name: $package_name" >&2
            exit 1
          fi
          if [ "$package_version" != "$expected_version" ]; then
            echo "generated package version $package_version does not match release tag $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Create tarball
        run: tar -czf pkg.tar.gz pkg

      - uses: actions/upload-artifact@v7
        with:
          name: wasm-${{ env.VERSION }}
          path: ./wasm/pkg.tar.gz
          retention-days: 1

      - name: Publish to npm
        if: github.event_name == 'release' && !github.event.release.prerelease
        working-directory: wasm/pkg
        run: npm publish --access public
